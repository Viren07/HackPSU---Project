<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PriorArt Lens</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1b1d22; --muted: #6b6f78; --line: #e3e1da;
    --accent: #c2185b; --good: #1f8a4c; --warn: #b26a00; --bad: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121317; --panel: #1b1d23; --ink: #ecebe6; --muted: #9a9ea8; --line: #2c2f37;
            --accent: #f06292; --good: #4cc38a; --warn: #f0b04a; --bad: #ef6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  .tag { color: var(--muted); margin: 2px 0 0; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 48px; }
  .capture { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
             display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn { appearance: none; border: 0; border-radius: 10px; padding: 12px 18px; font: inherit; font-weight: 600;
         background: var(--accent); color: #fff; cursor: pointer; }
  .btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; cursor: default; }
  label.toggle { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  #status { color: var(--muted); min-height: 1.5em; margin: 12px 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
  .card h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .card img { width: 100%; border-radius: 8px; display: block; background: #fff; }
  .score { font-size: 40px; font-weight: 700; line-height: 1; }
  .good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .series { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .swatch { width: 14px; height: 14px; border-radius: 4px; flex: none; }
  .muted { color: var(--muted); }
  .warnbox { background: color-mix(in srgb, var(--warn) 14%, transparent); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  th, td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  .tablewrap { max-height: 320px; overflow: auto; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>PriorArt <span>Lens</span></h1>
  <p class="tag">Point a camera at any graph. Get its data back, verified.</p>
</header>
<main>
  <div class="capture">
    <input id="file" type="file" accept="image/*" capture="environment" class="hidden">
    <button class="btn" id="snap">Take or upload a photo</button>
    <label class="toggle"><input type="checkbox" id="rectify" checked> Straighten photo (perspective fix)</label>
  </div>
  <div id="status"></div>

  <section id="results" class="hidden">
    <div class="grid">
      <div class="card">
        <h2>Verification</h2>
        <div id="score" class="score"></div>
        <div class="muted">render-and-compare match</div>
        <div id="axes" class="muted" style="margin-top:10px"></div>
        <div id="serieslist" style="margin-top:8px"></div>
        <div id="warnings"></div>
      </div>
      <div class="card" id="photoCard">
        <h2>On your photo</h2>
        <img id="photoImg" alt="Extracted points drawn on the original photo">
      </div>
      <div class="card">
        <h2>Straightened + extracted</h2>
        <img id="flatImg" alt="Straightened chart with extracted points">
      </div>
      <div class="card" id="redrawCard">
        <h2>Redrawn from the numbers</h2>
        <img id="redrawImg" alt="Chart redrawn from the extracted data">
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <h2 style="margin:0">Extracted data</h2>
        <button class="btn secondary" id="csv">Download CSV</button>
      </div>
      <div class="tablewrap"><table id="table"></table></div>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let last = null;

$("snap").onclick = () => $("file").click();
$("file").onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const fd = new FormData();
  fd.append("image", f);
  fd.append("rectify", $("rectify").checked);
  $("status").textContent = "Reading the graph...";
  $("snap").disabled = true;
  const t0 = performance.now();
  try {
    const r = await fetch("/api/extract", { method: "POST", body: fd });
    const data = await r.json();
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    if (!data.ok) { $("status").textContent = data.error; $("results").classList.add("hidden"); return; }
    last = data;
    render(data);
    $("status").textContent = `Done in ${secs}s.`;
  } catch (err) {
    $("status").textContent = "Could not reach the server: " + err;
  } finally {
    $("snap").disabled = false;
    $("file").value = "";
  }
};

function cls(v) { return v >= 0.9 ? "good" : v >= 0.75 ? "warn" : "bad"; }
function rgb(c) { return `rgb(${c[0]},${c[1]},${c[2]})`; }
function img(id, b64, cardId) {
  const card = cardId ? $(cardId) : null;
  if (!b64) { if (card) card.classList.add("hidden"); return; }
  if (card) card.classList.remove("hidden");
  $(id).src = "data:image/png;base64," + b64;
}

function render(d) {
  $("results").classList.remove("hidden");
  const s = $("score");
  s.textContent = Math.round(d.overall_match * 100) + "%";
  s.className = "score " + cls(d.overall_match);

  const ax = (name, a) => a
    ? `${name}-axis: ${a.ticks_consistent}/${a.ticks_found} tick labels agree${a.log ? " (log scale)" : ""}, fit error ${a.residual_px}px`
    : `${name}-axis: could not read tick labels`;
  $("axes").innerHTML = ax("x", d.x_axis) + "<br>" + ax("y", d.y_axis);

  $("serieslist").innerHTML = d.series.map((sr, i) => `
    <div class="series">
      <span class="swatch" style="background:${rgb(sr.color_rgb)}"></span>
      <span>Series ${i + 1} <span class="muted">(${sr.kind}, ${sr.n_points} pts)</span></span>
      <span style="margin-left:auto" class="${cls(sr.verify.match)}">${Math.round(sr.verify.match * 100)}%</span>
    </div>`).join("");
  $("warnings").innerHTML = (d.warnings || []).map(w => `<div class="warnbox">${w}</div>`).join("");

  img("photoImg", d.photo_overlay_png, "photoCard");
  img("flatImg", d.rectified_png);
  img("redrawImg", d.redrawn_png, "redrawCard");

  const rows = [];
  d.series.forEach((sr, i) => {
    const xs = sr.x || sr.px, ys = sr.y || sr.py;
    xs.forEach((x, k) => rows.push([i + 1, x, ys[k]]));
  });
  const fmt = (v) => Math.abs(v) >= 1000 || (Math.abs(v) < 0.01 && v !== 0) ? v.toExponential(3) : (+v.toPrecision(5)).toString();
  $("table").innerHTML = "<tr><th>series</th><th>x</th><th>y</th></tr>" +
    rows.slice(0, 400).map(r => `<tr><td>${r[0]}</td><td>${fmt(r[1])}</td><td>${fmt(r[2])}</td></tr>`).join("");
}

$("csv").onclick = () => {
  if (!last) return;
  let out = "series,x,y,match\n";
  last.series.forEach((sr, i) => {
    const xs = sr.x || sr.px, ys = sr.y || sr.py;
    xs.forEach((x, k) => out += `${i + 1},${x},${ys[k]},${sr.verify.match}\n`);
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], { type: "text/csv" }));
  a.download = "priorart_extracted.csv";
  a.click();
};
</script>
</body>
</html>
